# The source of truth for the Xcode project. Run scripts/generate.sh to generate
# Vertep.xcodeproj from it; the generated project is never committed.

name: Vertep

options:
  bundleIdPrefix: app.vertep
  developmentLanguage: en
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete

# The optional Private/ project. scripts/generate.sh sets VERTEP_PRO to YES only when
# Private/Package.swift exists, so a clone without Private/ never reads this file.
include:
  - path: Private/project.pro.yml
    enable: ${VERTEP_PRO}

packages:
  Core:
    path: Packages/Core
  LocalStore:
    path: Packages/LocalStore
  DesignSystem:
    path: Packages/DesignSystem
  Search:
    path: Packages/Search

targets:
  Vertep:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: Core
      - package: LocalStore
      - package: DesignSystem
      - package: Search
    # The search settings: empty in a plain clone, set on one machine by the git-ignored
    # Config/Local.xcconfig.
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      configs:
        # The App Attest environment the app attests in. The entitlements file reads it.
        Debug:
          VERTEP_APP_ATTEST_ENVIRONMENT: development
        Release:
          VERTEP_APP_ATTEST_ENVIRONMENT: production
      base:
        CODE_SIGN_ENTITLEMENTS: App/Vertep.entitlements
        # The generated Info.plist is merged with this file, which carries the search
        # settings to the app.
        INFOPLIST_FILE: App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: app.vertep.ios
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Vertep
        # The app has no icon yet. Without this, the asset catalog step looks for AppIcon.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  # Runs the attestation and a title search against the configured proxy on a physical
  # iPhone. It is in its own scheme, never in the Vertep scheme that CI runs.
  VertepDeviceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DeviceTests
    dependencies:
      - target: Vertep
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vertep.ios.devicetests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Vertep:
    build:
      targets:
        Vertep: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: Core/CoreTests
        - package: LocalStore/LocalStoreTests
        - package: DesignSystem/DesignSystemTests
        - package: Search/SearchTests
  VertepDeviceTests:
    build:
      targets:
        Vertep: all
        VertepDeviceTests: [test]
    test:
      config: Debug
      targets:
        - VertepDeviceTests
